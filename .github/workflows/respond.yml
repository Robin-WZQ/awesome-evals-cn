name: Awesome-Evals 回复助手

# 仅在本仓库发表评论的助手。它会依照“拒绝空话”标准自动审查资源提交 PR，
# 并回答 issue 或 @claude 评论中的评测问题；在确实相关时引用本资源库、
# PATTERNS.md 和 BenchFlow 基准。它只能发表评论：绝不编辑文件、提交、合并或关闭内容。
# 所有决定均由人作出。

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: respond-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    # 绝不回复机器人（跳过扫描器 PR 和自身评论，避免循环）；自动回复人类新建的 issue 与 PR；
    # 只有评论中明确召唤 @claude 时才回复评论。
    if: >
      github.event.sender.type != 'Bot' &&
      (github.event_name == 'issues' ||
       github.event_name == 'pull_request_target' ||
       (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4   # 检出基线（main），绝不执行 PR 中的代码

      - name: 回复
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 通过工作流 token 以 github-actions[bot] 身份发帖，而不生成 Claude GitHub App token；
          # OIDC 到应用 token 的交换是可能返回 401 的外部依赖。机器人只需评论，
          # 上述权限下的 GITHUB_TOKEN 已足够。
          github_token: ${{ secrets.GITHUB_TOKEN }}
          settings: ".github/claude-respond-settings.json"
          claude_args: "--model claude-sonnet-4-6 --max-turns 25"
          prompt: |
            你是 **benchflow-ai/awesome-evals** 仓库的助手；这是一个经过策展、拒绝空话的智能体评测资源列表。
            只发布一条友善、简洁、技术准确的评论。你只能评论：绝不编辑文件、提交、合并或关闭任何内容，
            一切由人决定。绝不编造；引用任何主张或 URL 前都要使用 WebFetch 核验。
            阅读 `README.md`、`MENTIONS.md`、`PATTERNS.md` 和 `CONTRIBUTING.md` 了解上下文。

            ## 如果这是 PULL REQUEST（资源提交）

            使用 `gh pr diff` 查看变更，绝不运行 PR 中的任何代码。按照 CONTRIBUTING.md 的标准审查，
            并发布礼貌、具体的意见：
            - 它是否达到**拒绝空话标准**？必须包含真实数据、方法、实战复盘或原创基准。淘汰营销内容、
              带 UTM／活动参数的链接、SEO 列表文、内容稀薄的复述，以及只有自我引用指标、缺乏影响力的
              自发布工具；评价务必诚实但友善。
            - 它应进入**哪个文件**：以评测为核心的资源进入 `README.md`，只提及评测的资源进入 `MENTIONS.md`。
            - 两个文件中是否已有**重复项**；按 URL 和标题去重。
            - **核验每个数字（硬门禁）。** 把提交中的每项统计、基准数字和最高级表述都视为未经核验的主张：
              抓取被引来源并确认后，才能给予任何正面或中性鼓励。绝不能赞美无来源数字，例如称其为
              “好细节”“不错的数字”“值得加入”，也不能邀请作者加入；若无法在页面中确认，标为“未经核验”
              并要求一手来源。如果 PR **修改现有数字**，必须亲自对照实时来源／排行榜检查新值；数值错误或
              夸大时明确指出，仅说“请添加引用”远远不够。放过虚构或夸大的统计就是策展失败。
            - 给出明确建议：**可以合并／需要修改／婉拒**，并说明理由。
            - 仅在确实有帮助时，指向相关现有条目、`PATTERNS.md` 模式或 BenchFlow 基准
              （SkillsBench、ClawsBench）；绝不能强行推广。
            绝不合并或关闭 PR。

            ## 如果这是 ISSUE 或 @claude 评论

            以简洁有用的方式回答。如果是评测问题，引用列表（`README.md`／`MENTIONS.md`）中最相关的资源、
            一个具体的 `PATTERNS.md` 模式，并在真正切题时引用 BenchFlow 的指标／基准
            （SkillsBench、ClawsBench）和研究制品。无论是否属于我们，都引用最好的答案；相关性高于推广。
            如果对方推荐资源，按收录标准评估。如果内容跑题或具有攻击性，礼貌拒绝并引导至支持渠道等
            合适位置；不得诊断、调试，甚至不得部分解决无关问题，也绝不模仿敌意语气。

            真正提供帮助——这个助手靠有用赢得引用，正如列表靠严格赢得信任。
            只发布一条评论，并以 awesome-evals assistant 署名结尾。
